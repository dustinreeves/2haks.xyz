<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel</title>
  <meta name="description" content="Draw pixel art on a 20×20 or 40×40 grid and share it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4' shape-rendering='crispEdges'%3E%3Crect width='2' height='2' fill='%23ff004d'/%3E%3Crect x='2' width='2' height='2' fill='%23ffec27'/%3E%3Crect y='2' width='2' height='2' fill='%2329adff'/%3E%3Crect x='2' y='2' width='2' height='2' fill='%2300e436'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>Pixel</h1>
    <div class="new-buttons">
      <button type="button" data-new="20">New 20×20</button>
      <button type="button" data-new="40">New 40×40</button>
    </div>
  </header>

  <main class="layout">
    <section class="tools" aria-label="Tools">
      <div class="tool-group" role="radiogroup" aria-label="Drawing tool">
        <button type="button" class="tool" data-tool="pencil" title="Pencil (B)" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L15 5l4 4L9 19z M13 7l4 4"/></svg><span>Pencil</span><kbd>B</kbd>
        </button>
        <button type="button" class="tool" data-tool="eraser" title="Eraser (E)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h12 M4 16l9-9 6 6-7 7H8z M9 11l6 6"/></svg><span>Eraser</span><kbd>E</kbd>
        </button>
        <button type="button" class="tool" data-tool="fill" title="Fill bucket (F)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l7-7 7 7-7 7z M5 11h14 M20 16c0 2-1 3-1.5 3S17 18 17 16l1.5-2.5z"/></svg><span>Fill</span><kbd>F</kbd>
        </button>
        <button type="button" class="tool" data-tool="picker" title="Colour picker (I)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l2-1 9-9-2-2-9 9z M13 8l3-3a2 2 0 013 3l-3 3"/></svg><span>Picker</span><kbd>I</kbd>
        </button>
        <button type="button" class="tool" data-tool="select" title="Select and move (S)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4 M12 4h4 M20 4v4 M20 12v4 M20 20h-4 M12 20H8 M4 20v-4 M4 12V8"/></svg><span>Select</span><kbd>S</kbd>
        </button>
      </div>

      <div class="selection-actions" aria-label="Selection">
        <button type="button" data-action="copy" title="Copy (Ctrl+C)">Copy</button>
        <button type="button" data-action="cut" title="Cut (Ctrl+X)">Cut</button>
        <button type="button" data-action="paste" title="Paste (Ctrl+V)">Paste</button>
        <button type="button" data-action="flipH" title="Flip left/right (H)">Flip ↔</button>
        <button type="button" data-action="flipV" title="Flip up/down (V)">Flip ↕</button>
        <button type="button" data-action="delete" title="Delete (Del)">Delete</button>
      </div>

      <div class="history">
        <button type="button" data-action="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button type="button" data-action="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      </div>

      <label class="toggle"><input type="checkbox" id="grid-toggle" checked> Show grid <kbd>G</kbd></label>
    </section>

    <section class="stage" aria-label="Canvas">
      <div class="canvas-wrap">
        <canvas id="canvas" width="640" height="640" aria-label="Drawing canvas"></canvas>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <section class="side">
      <div class="panel">
        <h2>Colours</h2>
        <div class="current">
          <span class="swatch-big" id="current-swatch"></span>
          <label class="custom">Pick any colour <input type="color" id="custom-color" value="#ff004d"></label>
        </div>
        <div class="palette" id="palette" role="radiogroup" aria-label="Palette"></div>
      </div>

      <div class="panel">
        <h2>Save</h2>
        <label class="field">Title <input id="title" maxlength="60" placeholder="My masterpiece"></label>
        <label class="field">Your name <input id="author" maxlength="30" placeholder="Tripp"></label>
        <div class="save-row">
          <button type="button" class="primary" data-action="save">Save</button>
          <button type="button" data-action="download">Download PNG</button>
        </div>
        <p class="hint" id="save-hint"></p>
      </div>
    </section>
  </main>

  <section class="gallery-section">
    <h2>Gallery</h2>
    <div class="gallery" id="gallery"><p class="hint">Loading…</p></div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
