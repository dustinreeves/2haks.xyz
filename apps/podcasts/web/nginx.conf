server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Artwork and audio come straight from Apple and the creators' own hosts, so images
    # and media may load from anywhere. Scripts, styles and API calls stay same-origin.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; media-src https: http:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ =404;
    }
}
